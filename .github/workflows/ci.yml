name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Official images keep end-of-life versions that setup-python drops.
        python-version: ["3.9", "3.13"]
    container: python:${{ matrix.python-version }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: python verify_tenhou_shuffle.py
      - run: python -m unittest discover -s tests -v
